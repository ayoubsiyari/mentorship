services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talaria}
      POSTGRES_USER: ${POSTGRES_USER:-talaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talaria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talaria} -d ${POSTGRES_DB:-talaria}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trading-chart:
    build:
      context: ./trading-chart
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://talaria:talaria@db:5432/talaria}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-change-me}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@local.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminadmin}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${GOOGLE_SERVICE_ACCOUNT_FILE:-/run/secrets/google-service-account.json}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      GOOGLE_SHEETS_SHEET_NAME: ${GOOGLE_SHEETS_SHEET_NAME:-Registrations}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-}
    volumes:
      - ./secrets:/run/secrets:ro
      - newsletter_uploads:/app/uploads/newsletter
      - /var/log:/host-logs
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  homepage:
    build:
      context: ./homepage
    ports:
      - "8080:80"
    depends_on:
      - trading-chart

  journal-backend:
    build:
      context: ./journal-backend
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talaria}:${POSTGRES_PASSWORD:-talaria}@db:5432/${POSTGRES_DB:-talaria}
      FLASK_ENV: production
      FLASK_DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-jwt-secret-change-me}
      FRONTEND_URL: ${FRONTEND_URL:-https://talaria-log.com/journal}
      CORS_ALLOWED_ORIGINS: "https://talaria-log.com,http://88.223.95.90:8000,http://88.223.95.90:3001"
      DOMAIN_EMAIL_SMTP_SERVER: ${DOMAIN_EMAIL_SMTP_SERVER:-smtp.gmail.com}
      DOMAIN_EMAIL_SMTP_PORT: ${DOMAIN_EMAIL_SMTP_PORT:-587}
      DOMAIN_EMAIL_USERNAME: ${DOMAIN_EMAIL_USERNAME:-}
      DOMAIN_EMAIL_PASSWORD: ${DOMAIN_EMAIL_PASSWORD:-}
      DOMAIN_EMAIL_USE_TLS: "true"
      ADMIN_ALERT_EMAIL: ${ADMIN_ALERT_EMAIL:-contact@talaria.services}
    depends_on:
      db:
        condition: service_healthy

  journal-frontend:
    build:
      context: ./journal-frontend
    ports:
      - "${JOURNAL_PORT:-3001}:80"
    depends_on:
      - journal-backend

volumes:
  postgres_data:
  newsletter_uploads:
